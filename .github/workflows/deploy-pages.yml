name: Publish original Hooked416 website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out website repository
        uses: actions/checkout@v4
      - name: Prepare original website
        run: |
          set -euo pipefail
          test -f Hooked416-GitHub-Pages-Publish/index.html
          mkdir -p _site
          cp -a Hooked416-GitHub-Pages-Publish/. _site/
          test -f _site/index.html
          test -f _site/CNAME
          echo "Ready to publish original Hooked416 site"
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        id: upload
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Wait for the Pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        run: |
          for attempt in {1..12}; do
            sleep 5
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=github-pages" |
              jq -e --arg id "$PAGES_ARTIFACT_ID" '.artifacts | any((.id | tostring) == $id and .expired == false)' > /dev/null; then
              exit 0
            fi
          done
          echo "::error::GitHub did not list the uploaded Pages artifact within 60 seconds."
          exit 1
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
